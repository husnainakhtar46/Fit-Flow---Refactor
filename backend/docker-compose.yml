version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fitflow_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fitflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitflow_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DJANGO_ENV=production
      - DJANGO_SETTINGS_MODULE=quality_check.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-fitflow_prod_secret_key_change_me_in_env_file}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-fitflow_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password_123}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - MEDIA_ROOT=/app/media
      - GMAIL_TOKEN_PATH=/app/gmail-token.json
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles

volumes:
  postgres_data:
    name: fitflow_postgres_data
  media_volume:
    name: fitflow_media_volume
  static_volume:
    name: fitflow_static_volume
